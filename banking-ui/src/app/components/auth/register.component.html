<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <i class="fas fa-user-plus fa-3x"></i>
      <h2>Create Account</h2>
      <p>Register for banking access</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control" [(ngModel)]="username" name="username" placeholder="Enter username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Enter email" required>
        </div>
        <small class="text-muted" *ngIf="email && !isValidEmail">Please enter a valid email address</small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group password-group">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="Enter password" required>
          <span class="password-toggle" (click)="togglePasswordVisibility()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
        <small class="text-muted">Minimum 6 characters</small>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-group password-group">
          <span class="input-icon"><i class="fas fa-check-circle"></i></span>
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
          <span class="password-toggle" (click)="toggleConfirmPasswordVisibility()">
            <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading || !isFormValid()">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Registering...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
