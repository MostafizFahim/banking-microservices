<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <i class="fas fa-user-plus fa-3x"></i>
      <h2>Create Account</h2>
      <p>Register for banking access</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control" [(ngModel)]="username" name="username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
        </div>
        <small class="text-muted">Minimum 6 characters</small>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-check-circle"></i></span>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Registering...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
